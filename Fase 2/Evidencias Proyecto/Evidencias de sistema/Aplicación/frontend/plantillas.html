<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plantillas · BuildCast</title>
  <link rel="icon" type="image/svg+xml" href="/buildcast-icon-app.svg">
  <link rel="apple-touch-icon" href="/buildcast-icon-app.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/src/estilos/base.css">
  <script>try{var t=localStorage.getItem('buildcast.tema');if(t!=='claro'&&(t==='oscuro'||matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.tema='oscuro'}catch(e){}</script>
</head>
<body x-data="plantillas" x-init="cargar()">
  <div class="bc-progreso" x-show="cargando || abriendo" x-cloak aria-hidden="true"></div>

  <header class="bc-barra">
    <div>
      <div class="bc-marca-grupo">
        <a href="/panel.html" class="bc-marca">
          <img src="/buildcast-logo.svg" alt="BuildCast" class="bc-logo bc-logo--claro">
          <img src="/buildcast-logo-dark.svg" alt="BuildCast" class="bc-logo bc-logo--oscuro">
        </a>
        <button type="button" class="bc-tema" data-tema-boton aria-label="Cambiar a modo oscuro" aria-pressed="false" title="Modo oscuro">
          <svg class="bc-tema__luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="bc-tema__sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
      <nav class="bc-nav">
        <a href="/panel.html">Panel</a>
        <a href="/proyectos.html">Proyectos</a>
        <a href="/precios.html">Banco de precios</a>
        <a href="/plantillas.html" aria-current="page">Plantillas</a>
        <a href="/configuracion.html">Configuración</a>
        <a href="/administracion.html" data-solo-admin hidden>Administración</a>
      </nav>
      <span class="bc-cuenta">
        <span class="bc-placa"><img src="/ram-logo.png" alt=""></span>
        <span>RAM Arquitectura &amp; Construcción</span>
      </span>
      <button type="button" class="bc-boton bc-boton--linea bc-boton--menor" @click="salir()">Salir</button>
    </div>
  </header>

  <main class="bc-pagina" x-cloak>

    <!-- Listado -->
    <template x-if="!seleccionada">
      <div style="display:flex;flex-direction:column;gap:clamp(20px,2.4vw,32px)">
        <div class="bc-encabezado">
          <div>
            <span class="bc-rotulo">Administración</span>
            <h1 class="bc-h1">Plantillas de presupuesto</h1>
            <p class="bc-apoyo" style="margin-top:6px">Cada plantilla propone las partidas iniciales de un proyecto según su tipo de obra y materialidad. Al crear un proyecto se copian; después se pueden ajustar libremente y cambiar la plantilla no altera proyectos ya creados.</p>
          </div>
          <div class="bc-acciones">
            <button type="button" class="bc-boton" @click="abrirNueva()">+ Nueva plantilla</button>
          </div>
        </div>

        <p class="bc-aviso bc-aviso--error" x-show="error" x-text="error"></p>
        <div class="bc-cargando" x-show="cargando" role="status" aria-live="polite">
          <p class="bc-cargando__aviso"><span class="bc-cargando__obra" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Cargando plantillas…</p>
          <div class="bc-carga-filas" aria-hidden="true">
            <div class="bc-carga-fila"><span></span><span></span><span></span></div>
            <div class="bc-carga-fila"><span></span><span></span><span></span></div>
            <div class="bc-carga-fila"><span></span><span></span><span></span></div>
            <div class="bc-carga-fila"><span></span><span></span><span></span></div>
          </div>
        </div>

        <div class="bc-tarjeta bc-lista--numerada bc-aparece" x-show="!cargando && plantillas.length > 0" :aria-busy="abriendo !== ''">
          <template x-for="p in ordenadas" :key="p.id">
            <div class="bc-lista__fila bc-lista__fila--amplia"
                 :class="{ 'bc-lista__fila--abriendo': abriendo === p.id, 'bc-lista__fila--vacia': !p.cantidad_partidas }">
              <div>
                <b x-text="p.tipo_obra + ' · ' + p.materialidad"></b>
                <span class="bc-nota bc-lista__detalle"
                      x-text="(p.cantidad_partidas ? p.cantidad_partidas + ' partida(s)' : 'Sin partidas configuradas')
                        + (p.nombre !== p.tipo_obra + ' · ' + p.materialidad ? ' · ' + p.nombre : '')"></span>
              </div>
              <div class="bc-acciones">
                <span class="bc-estado" x-show="!p.vigente">Inactiva</span>
                <button type="button" class="bc-boton bc-boton--linea bc-boton--menor" @click="abrir(p)"
                        :disabled="abriendo !== ''" :aria-busy="abriendo === p.id"
                        x-text="abriendo === p.id ? 'Abriendo…' : 'Editar'"></button>
              </div>
            </div>
          </template>
        </div>

        <div class="bc-vacio bc-aparece" x-show="!cargando && plantillas.length === 0 && !error">
          <span class="bc-rotulo">Sin plantillas</span>
          <h2 class="bc-h2">Todavía no hay plantillas</h2>
          <p class="bc-apoyo">Crea una para proponer partidas iniciales a los proyectos nuevos.</p>
        </div>
      </div>
    </template>

    <!-- Detalle -->
    <template x-if="seleccionada">
      <div style="display:flex;flex-direction:column;gap:clamp(20px,2.4vw,32px)">
        <div class="bc-encabezado">
          <div>
            <p class="bc-migas"><button type="button" class="bc-enlace" @click="volver()">← Plantillas</button></p>
            <h1 class="bc-h1" x-text="seleccionada.tipo_obra + ' · ' + seleccionada.materialidad"></h1>
          </div>
        </div>

        <p class="bc-aviso bc-aviso--error" role="alert" x-show="error" x-text="error"></p>
        <p class="bc-aviso" role="status" x-show="mensaje && !error" x-text="mensaje"></p>

        <div class="bc-dupla">
          <div style="display:flex;flex-direction:column;gap:20px;min-width:0">
            <div class="bc-tarjeta bc-desplaza">
              <table class="bc-tabla bc-tabla--banco bc-tabla--partidas bc-tabla--plantilla" x-show="lista.length > 0">
                <thead>
                  <tr>
                    <th style="width:48px">#</th>
                    <th>Partida</th>
                    <th style="width:80px">Unidad</th>
                    <th class="bc-num" style="width:160px">Cantidad sugerida</th>
                    <th style="width:104px"><span class="bc-oculto">Acciones</span></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(f, i) in lista" :key="f.partida_id">
                    <tr>
                      <td class="bc-tabla__codigo" x-text="i + 1"></td>
                      <td>
                        <span class="bc-tabla__nombre" x-text="f.nombre"></span>
                        <span class="bc-nota" style="display:block"
                              x-text="f.codigo + ' · ' + nombreCategoria(f.categoria_id) + (f.vigente ? '' : ' · dada de baja: no se propone')"></span>
                      </td>
                      <td class="bc-tabla__suave" x-text="f.unidad"></td>
                      <td class="bc-num">
                        <input class="bc-entrada bc-entrada--celda" type="number" min="0" step="any"
                               :value="f.cantidad_sugerida" placeholder="Por definir"
                               :aria-label="'Cantidad sugerida de ' + f.nombre"
                               @change="cambiarCantidad(f, $event.target.value)">
                      </td>
                      <td>
                        <span class="bc-tabla__acciones">
                          <button type="button" class="bc-icono" title="Subir" aria-label="Subir" :disabled="i === 0" @click="mover(i, -1)">↑</button>
                          <button type="button" class="bc-icono" title="Bajar" aria-label="Bajar" :disabled="i === lista.length - 1" @click="mover(i, 1)">↓</button>
                          <button type="button" class="bc-icono bc-icono--quitar" title="Quitar partida"
                                  :aria-label="'Quitar ' + f.nombre" @click="quitar(i)">✕</button>
                        </span>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>

              <div class="bc-vacio" x-show="lista.length === 0" style="border:0">
                <span class="bc-rotulo">Sin partidas configuradas</span>
                <p class="bc-apoyo">Agrega partidas del catálogo. Los proyectos nuevos de esta combinación partirán con ellas.</p>
              </div>
            </div>

            <div class="bc-acciones">
              <button type="button" class="bc-boton" :disabled="!cambios || guardando" @click="guardarPartidas()"
                      x-text="guardando ? 'Guardando…' : 'Guardar partidas'"></button>
              <span class="bc-nota" x-show="cambios">Hay cambios sin guardar.</span>
            </div>
            <p class="bc-nota">La cantidad sugerida es opcional: úsala para partidas fijas, por ejemplo 1 gl. Si queda vacía, la cantidad se define en cada proyecto.</p>
          </div>

          <aside style="display:flex;flex-direction:column;gap:20px">
            <div class="bc-tarjeta bc-tarjeta--relleno">
              <span class="bc-rotulo">Agregar del catálogo</span>
              <div class="bc-campo" style="margin:16px 0 12px">
                <label for="buscar">Buscar partida</label>
                <input class="bc-entrada" id="buscar" type="search" placeholder="Nombre o código" x-model="busqueda">
              </div>
              <div class="bc-lista">
                <template x-for="f in resultados" :key="f.id">
                  <div class="bc-lista__fila">
                    <div>
                      <b x-text="f.codigo + ' · ' + f.nombre"></b>
                      <span class="bc-nota" style="display:block;padding:0" x-text="f.unidad"></span>
                    </div>
                    <button type="button" class="bc-boton bc-boton--linea bc-boton--menor" @click="agregar(f)">Agregar</button>
                  </div>
                </template>
                <p class="bc-nota" x-show="resultados.length === 0">No hay más partidas que coincidan.</p>
              </div>
            </div>

            <div class="bc-tarjeta bc-tarjeta--relleno">
              <span class="bc-rotulo">Datos de la plantilla</span>
              <div class="bc-form" style="margin-top:16px">
                <div class="bc-campo">
                  <label for="pl-nombre">Nombre</label>
                  <input class="bc-entrada" id="pl-nombre" x-model="datos.nombre">
                </div>
                <div class="bc-campo">
                  <label for="pl-tipo">Tipo de obra</label>
                  <select class="bc-entrada" id="pl-tipo" x-model="datos.tipo_obra">
                    <template x-for="t in tipos" :key="t"><option :value="t" x-text="t"></option></template>
                  </select>
                </div>
                <div class="bc-campo">
                  <label for="pl-material">Materialidad</label>
                  <select class="bc-entrada" id="pl-material" x-model="datos.materialidad">
                    <template x-for="m in materiales" :key="m"><option :value="m" x-text="m"></option></template>
                  </select>
                </div>
                <label class="bc-casilla">
                  <input type="checkbox" x-model="datos.vigente">
                  <span>Activa: se aplica a los proyectos nuevos</span>
                </label>
                <button type="button" class="bc-boton bc-boton--linea" :disabled="guardando" @click="guardarDatos()">Guardar datos</button>
              </div>
              <p class="bc-nota" style="margin-top:12px">Solo puede haber una plantilla activa por tipo de obra y materialidad.</p>
            </div>
          </aside>
        </div>
      </div>
    </template>

  </main>
  <div class="bc-esqueleto" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>


  <!-- Nueva plantilla -->
  <div class="bc-capa" x-show="formNueva" @click.self="formNueva = false" x-cloak>
    <div class="bc-modal">
      <span class="bc-rotulo">Plantillas</span>
      <h2 class="bc-h2" style="margin-bottom:20px">Nueva plantilla</h2>
      <div class="bc-form">
        <div class="bc-campo">
          <label for="np-tipo">Tipo de obra</label>
          <select class="bc-entrada" id="np-tipo" x-model="nueva.tipo_obra">
            <template x-for="t in tipos" :key="t"><option :value="t" x-text="t"></option></template>
          </select>
        </div>
        <div class="bc-campo">
          <label for="np-material">Materialidad</label>
          <select class="bc-entrada" id="np-material" x-model="nueva.materialidad">
            <template x-for="m in materiales" :key="m"><option :value="m" x-text="m"></option></template>
          </select>
        </div>
        <div class="bc-campo">
          <label for="np-nombre">Nombre (opcional)</label>
          <input class="bc-entrada" id="np-nombre" x-model="nueva.nombre" :placeholder="nueva.tipo_obra + ' · ' + nueva.materialidad">
        </div>
        <p class="bc-error" x-show="errorNueva" x-text="errorNueva"></p>
        <div class="bc-acciones">
          <button type="button" class="bc-boton" :disabled="guardando" @click="crear()">Crear plantilla</button>
          <button type="button" class="bc-boton bc-boton--linea" @click="formNueva = false">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/paginas/plantillas.ts"></script>
</body>
</html>
